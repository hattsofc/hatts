<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hatts · Páginas web para consultorios y clínicas</title>
<meta name="description" content="Páginas web de una sola pantalla para consultorios y clínicas de Paraguay. Pago único, entrega en 5 días.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--ink:#101826;--mut:#56627a;--acc:#2b4eff;--line:#10182622;--card:#fff;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.03em;line-height:1.02}
a{color:inherit}
.w{max-width:1080px;margin:0 auto;padding:0 22px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-weight:800;font-size:1.6rem;text-decoration:none}
.logo i{color:var(--acc);font-style:normal}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:.8rem 1.3rem;border-radius:99px;text-decoration:none;font-weight:600;font-size:.98rem;transition:background .2s}
.btn:hover{background:var(--acc)}
.btn.o{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.o:hover{background:var(--ink);color:#fff}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:56px 0 90px}
h1{font-size:clamp(2.6rem,6.2vw,4.9rem);font-weight:800}
.hero p{max-width:30em;margin:22px 0 30px;color:var(--mut);font-size:1.15rem}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.maps{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 30px 60px -30px #10182655;transform:rotate(1.6deg)}
.maps .t{font-weight:600;font-size:1.15rem}
.maps .s{color:var(--mut);font-size:.9rem;margin:2px 0 14px}
.maps .row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:.4rem .9rem;font-size:.85rem;font-weight:500}
.chip.x{border:1.5px dashed var(--acc);color:var(--acc);background:#2b4eff0f}
.maps .n{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.9rem;color:var(--mut)}
section{padding:70px 0;border-top:1px solid var(--line)}
section>.w>h2{font-size:clamp(1.9rem,4vw,3rem);max-width:15em;margin-bottom:34px;font-weight:700}
.item{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.item h3{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.item p{color:var(--mut)}
.price .item{align-items:baseline}
.price .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2.4rem;letter-spacing:-.04em;text-align:right;white-space:nowrap}
.price .item{grid-template-columns:1fr auto}
.price .item h3{margin-bottom:4px}
.big small{display:block;line-height:1.55;font:500 .85rem/1.55 Figtree,sans-serif;letter-spacing:0;color:var(--mut);margin-top:2px}
.big s{font-size:1.25rem;color:var(--mut);font-weight:600;margin-right:8px}
.tag{display:inline-block;background:var(--acc);color:#fff;font:600 .75rem Figtree,sans-serif;border-radius:99px;padding:.15rem .65rem;margin-left:10px;vertical-align:middle;letter-spacing:0}
.note{margin-top:22px;color:var(--mut);font-size:.95rem}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:26px}
.steps div::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;font:800 1.1rem 'Bricolage Grotesque';margin-bottom:14px}
.steps h3{font-size:1.2rem;margin-bottom:6px}
.steps p{color:var(--mut);font-size:.98rem}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;font-weight:600;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";font-size:1.4rem;line-height:1;transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--mut);margin-top:10px;max-width:42em}
.end{background:var(--ink);color:#fff;border-radius:28px;padding:56px 40px;margin:70px 0 40px}
.end h2{font-size:clamp(2rem,4.5vw,3.4rem);max-width:14em;margin-bottom:26px;font-weight:800}
.end .btn{background:#fff;color:var(--ink)}
.end .btn:hover{background:var(--acc);color:#fff}
footer{padding:0 0 40px;color:var(--mut);font-size:.92rem}
a:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:30px}.maps{transform:none}.item{grid-template-columns:1fr;gap:4px}
.price .item{grid-template-columns:1fr;gap:12px;padding:26px 0}
.price .big{text-align:left;font-size:2.3rem}
.price h3 .tag{display:table;margin:10px 0 0}
.price .item p{font-size:1.05rem}
section{padding:54px 0}}
</style>
</head>
<body>
<div class="w">
<header><a class="logo" href="#" id="logo"></a><a class="btn" id="waTop" href="#">Escribir por WhatsApp</a></header>

<div class="hero">
  <div>
    <h1 id="h1"></h1>
    <p id="sub"></p>
    <div class="cta"><a class="btn" id="waHero" href="#">Pedir una muestra gratis</a><a class="btn o" href="#precios">Ver precios</a></div>
  </div>
  <div class="maps" aria-hidden="true">
    <div class="t" id="mapNombre"></div>
    <div class="s" id="mapMeta"></div>
    <div class="row"><span class="chip">Llamar</span><span class="chip">Cómo llegar</span><span class="chip x">Sitio web</span></div>
    <div class="n" id="mapNota"></div>
  </div>
</div>
</div>

<section id="incluye"><div class="w"><h2>Una página simple que hace una cosa: que te escriban.</h2><div id="incluyeL"></div></div></section>
<section id="precios" class="price"><div class="w"><h2>Pagas una vez. La página es tuya.</h2><div id="preciosL"></div><p class="note" id="precioNota"></p></div></section>
<section><div class="w"><h2>Así trabajamos</h2><div class="steps" id="pasosL"></div></div></section>
<section><div class="w"><h2>Preguntas frecuentes</h2><div id="faqL"></div></div></section>

<div class="w">
  <div class="end"><h2 id="cierre"></h2><a class="btn" id="waEnd" href="#">Escribirme por WhatsApp</a></div>
  <footer id="pie"></footer>
</div>

<script>
/* ============================================================
   EDITA SOLO ESTE BLOQUE. Cambia los textos entre comillas.
   No borres las comillas, las comas ni los corchetes.
   ============================================================ */
const D = {
  marca: "hatts",
  logo: "logo-hatts.png",                  // archivo del logo en la misma carpeta (déjalo vacío para mostrar solo el nombre)
  nombre: "Vivi",
  ciudad: "Itauguá, Paraguay",
  whatsapp: "595986605013",          // tu número con código de país, sin + ni espacios
  mensajeWhatsapp: "Hola, vi su página y me interesa una web para mi consultorio.",
  instagram: "",                      // ej: "https://instagram.com/tuusuario" (déjalo vacío si no tienes)

  titular: "Tus pacientes ya te buscan en Google. Dales dónde escribirte.",
  subtitulo: "Hago páginas web de una sola pantalla para consultorios y clínicas, con botón de WhatsApp para agendar citas. Te muestro cómo quedaría antes de que pagues.",

  ejemploNombre: "Consultorio Dra. Gómez",
  ejemploMeta: "Odontología · 4.9 (27 reseñas) · Asunción",
  ejemploNota: "Hoy tus pacientes ven el mapa y nada más. Con una página, ven tus tratamientos, tus horarios y un botón para escribirte.",

  incluye: [
    ["Adaptada a tu consultorio", "Tus colores, tu logo y tus fotos aplicados sobre un diseño profesional ya probado."],
    ["Botón de WhatsApp", "El paciente toca y te escribe con el mensaje ya armado."],
    ["Se ve bien en el celular", "La mayoría de las búsquedas son desde el teléfono, así que parte de ahí."],
    ["Tus datos en un solo lugar", "Tratamientos, horarios, mapa y reseñas, ordenados para que se entienda en segundos."],
    ["Entrega completa", "Recibes los archivos y una guía de una página para cambiar textos y fotos tú mismo."]
  ],

  // Cada precio: [nombre, descripción, precio en dólares, precio en guaraníes, etiqueta de oferta, precio anterior en dólares, precio anterior en guaraníes]
  // Para quitar una oferta, deja vacíos los últimos tres: "", "", ""
  precios: [
    ["Tarjeta digital", "Mini página con WhatsApp, horario, mapa y redes.", "$30", "(Gs. 180.000)", "", "", ""],
    ["Página web", "Una pantalla completa con tus servicios, horarios, mapa y botón de WhatsApp.", "$35", "(Gs. 215.000)|Luego sube a $40 (Gs. 245.000)", "Precio de lanzamiento", "", ""]
  ],
  notaPrecios: "Pago único. 50% para empezar y 50% al publicar. Sin mensualidades. Los precios en guaraníes son aproximados y dependen del cambio del día.",

  pasos: [
    ["Me escribes", "Me cuentas qué haces y dónde atiendes."],
    ["Recibes una muestra", "En 24 a 48 horas ves cómo quedaría con tus datos, sin pagar."],
    ["Ajustamos", "Dos rondas de cambios hasta que te guste."],
    ["Publico y entrego", "Tu página queda online y te paso todo lo necesario."]
  ],

  faq: [
    ["¿Hay mensualidades?", "No. Es un trabajo de entrega única. Pagas una vez y la página queda a tu nombre."],
    ["¿Quién la actualiza después?", "Tú, con la guía de una página que te entrego, o cualquier persona que trabaje con páginas web. Si prefieres que lo haga yo, cuesta $15 por pedido de hasta 4 cambios pequeños. Durante 7 días corrijo cualquier error de lo entregado."],
    ["¿Cuánto tarda?", "Entre 3 y 5 días hábiles desde que me envías tus datos."],
    ["¿Y si no me gusta?", "Ves la muestra gratis antes de decidir. Si no te convence, no pagas nada."]
  ],

  cierre: "¿Te muestro cómo quedaría tu consultorio?",
  pie: "© 2026 Hatts Diseños. Hecho en Paraguay."
};
/* ================== FIN DEL BLOQUE EDITABLE ================== */

const $ = id => document.getElementById(id);
const wa = "https://wa.me/" + D.whatsapp + "?text=" + encodeURIComponent(D.mensajeWhatsapp);
const mk = (t, c) => { const e = document.createElement("div"); if (c) e.className = c; e.innerHTML = t; return e; };
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

$("logo").innerHTML = D.logo ? `<img src="${esc(D.logo)}" alt="${esc(D.marca)}" style="height:46px;width:auto;display:block">` : esc(D.marca) + "<i>.</i>";
["waTop", "waHero", "waEnd"].forEach(i => $(i).href = wa);
$("h1").textContent = D.titular;
$("sub").textContent = D.subtitulo;
$("mapNombre").textContent = D.ejemploNombre;
$("mapMeta").textContent = D.ejemploMeta;
$("mapNota").textContent = D.ejemploNota;
$("precioNota").textContent = D.notaPrecios;
$("cierre").textContent = D.cierre;
D.incluye.forEach(([t, p]) => $("incluyeL").append(mk(`<h3>${esc(t)}</h3><p>${esc(p)}</p>`, "item")));
D.precios.forEach(([t, p, m, g, tag, ant, antG]) => $("preciosL").append(mk(
  `<div><h3>${esc(t)}${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</h3><p>${esc(p)}</p></div>` +
  `<div class="big">${ant ? `<s>${esc(ant)}</s>` : ""}${esc(m)}<small>${g.split("|").map(esc).join("<br>")}${ant && antG ? ` · antes ${esc(antG)}` : ""}</small></div>`, "item")));
D.pasos.forEach(([t, p]) => $("pasosL").append(mk(`<h3>${esc(t)}</h3><p>${esc(p)}</p>`)));
D.faq.forEach(([q, a]) => { const d = document.createElement("details"); d.innerHTML = `<summary>${esc(q)}</summary><p>${esc(a)}</p>`; $("faqL").append(d); });
$("pie").innerHTML = esc(D.pie) + (D.instagram ? ` <a href="${esc(D.instagram)}" target="_blank" rel="noopener">Instagram</a>` : "");
document.title = D.marca + " · Páginas web para consultorios y clínicas";
</script>
</body>
</html>
