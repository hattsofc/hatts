<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#6d3bd2;--bg:#f2f0f7;--card:#fff;--tx:#17141f;--mut:#6b6679;--line:#17141f1a}
body.oscuro{--bg:#0d0b12;--card:#17131f;--tx:#f4f0fb;--mut:#a79fba;--line:#ffffff1f}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--bg);color:var(--tx);font:400 1rem/1.5 Figtree,system-ui,sans-serif;display:grid;place-items:start center;padding:28px 16px 60px;background-image:radial-gradient(70% 35% at 50% 0%,color-mix(in srgb,var(--acc) 30%,transparent),transparent)}
.card{width:100%;max-width:430px;background:var(--card);border-radius:30px;padding:34px 24px 26px;box-shadow:0 30px 70px -35px color-mix(in srgb,var(--acc) 70%,#000);text-align:center;border:1px solid var(--line)}
.av{width:112px;height:112px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 55%,#fff),var(--acc));display:grid;place-items:center;overflow:hidden;color:#fff;font:800 2.4rem 'Bricolage Grotesque',sans-serif;box-shadow:0 0 0 5px var(--card),0 0 0 7px var(--acc)}
.av img{width:100%;height:100%;object-fit:cover}
h1{font:800 1.7rem/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.rol{color:var(--acc);font-weight:600;margin:6px 0 10px}
.bio{color:var(--mut);font-size:.98rem;margin:0 auto 22px;max-width:30em}
.bt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:.95rem 1.2rem;margin-bottom:10px;border-radius:16px;text-decoration:none;font-weight:600;color:var(--tx);background:color-mix(in srgb,var(--acc) 9%,var(--card));border:1px solid var(--line);transition:transform .15s,background .15s}
.bt:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.bt.p{background:var(--acc);color:#fff;border-color:transparent}
.bt::after{content:"";width:9px;height:9px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg);opacity:.7}
.hr{margin:20px 0 6px;padding:16px;border-radius:16px;border:1px solid var(--line);text-align:left;font-size:.95rem}
.hr b{display:block;margin-bottom:6px;font-family:'Bricolage Grotesque',sans-serif}
.hr div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--mut)}
.hr div span:last-child{color:var(--tx);font-weight:600}
.sv{margin-top:14px;background:none;border:0;color:var(--acc);font:600 .95rem Figtree,sans-serif;cursor:pointer;text-decoration:underline}
.cr{margin-top:18px;font-size:.8rem;color:var(--mut)}
.mu{position:fixed;top:0;left:0;right:0;z-index:7;background:var(--acc);color:#fff;text-align:center;font:600 .8rem Figtree,sans-serif;padding:.4rem}
body.m{padding-top:50px}
body.m::after{content:"MUESTRA";position:fixed;inset:0;display:grid;place-items:center;font:800 24vw 'Bricolage Grotesque',sans-serif;color:var(--tx);opacity:.05;transform:rotate(-24deg);pointer-events:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <div class="av" id="av"></div>
  <h1 id="nombre"></h1>
  <div class="rol" id="rol"></div>
  <p class="bio" id="bio"></p>
  <div id="botones"></div>
  <div class="hr" id="hr"></div>
  <button class="sv" id="sv" type="button">Guardar en mis contactos</button>
  <div class="cr" id="cr"></div>
</main>
<script>
/* ============================================================
   EDITA SOLO ESTE BLOQUE para cada cliente.
   No borres las comillas, las comas ni los corchetes.
   Si no quieres un botón, deja su texto vacío: ""
   ============================================================ */
const D = {
  muestra: false,                       // true = muestra con marca de agua. Pon false en la versión final
  tema: "oscuro",                       // "claro" u "oscuro"
  colorPrincipal: "#2b4eff",            // color de botones y detalles (código hexadecimal)

  nombre: "Hatts Diseños",
  rol: "Páginas web y tarjetas digitales",
  bio: "Diseño páginas web de una sola pantalla y tarjetas digitales para negocios y profesionales de Paraguay. Pide tu muestra gratis.",
  logo: "avatar.png",                   // enlace o ruta del logo o foto, ej: "logo.png". Si queda vacío se muestran las iniciales
  iniciales: "H",

  whatsapp: "595986605013",            // número con código de país, sin + ni espacios
  mensajeWhatsapp: "Hola, vi su tarjeta y me interesa una página web para mi negocio.",
  textoWhatsapp: "Escribir por WhatsApp",

  instagram: "#",                       // por ahora no lleva a ningún link real
  facebook: "",
  web: "https://hattsofc.github.io/hatts/",
  extras: [],                           // botones extra: [["Texto del botón", "enlace"]]. Si el enlace está vacío no aparece

  mapaConsulta: "",                     // lo que busca Google Maps. Si queda vacío, no aparece el botón
  mapaEnlace: "",                       // opcional: enlace de Google Maps (botón Compartir)
  textoMapa: "Cómo llegar",

  horario: [],                          // ej: [["Lunes a viernes", "9:00 a 17:00"]]. Si queda vacío, no aparece
  credito: ""
};

/* ================== FIN DEL BLOQUE EDITABLE ================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.documentElement.style.setProperty("--acc", D.colorPrincipal);
if (D.tema === "oscuro") document.body.classList.add("oscuro");
document.title = D.nombre;
$("nombre").textContent = D.nombre; $("rol").textContent = D.rol; $("bio").textContent = D.bio; $("cr").textContent = D.credito;
$("av").innerHTML = D.logo ? `<img src="${esc(D.logo)}" alt="${esc(D.nombre)}">` : esc(D.iniciales);
const btn = (t, u, p) => { if (!t || !u) return; const a = document.createElement("a"); a.className = "bt" + (p ? " p" : ""); a.href = u; a.target = "_blank"; a.rel = "noopener"; a.textContent = t; $("botones").append(a); };
btn(D.textoWhatsapp, D.whatsapp ? "https://wa.me/" + D.whatsapp + "?text=" + encodeURIComponent(D.mensajeWhatsapp) : "", true);
btn("Instagram", D.instagram); btn("Facebook", D.facebook); btn("Sitio web", D.web);
D.extras.forEach(([t, u]) => btn(t, u));
btn(D.textoMapa, D.mapaConsulta || D.mapaEnlace ? (D.mapaEnlace || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(D.mapaConsulta)) : "");
if (D.horario.length) $("hr").innerHTML = "<b>Horario</b>" + D.horario.map(([d, h]) => `<div><span>${esc(d)}</span><span>${esc(h)}</span></div>`).join(""); else $("hr").remove();
$("sv").onclick = () => {
  const v = `BEGIN:VCARD\nVERSION:3.0\nFN:${D.nombre}\nORG:${D.nombre}\nTEL;TYPE=CELL:+${D.whatsapp}\nEND:VCARD`;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([v], { type: "text/vcard" })); a.download = D.nombre + ".vcf"; a.click();
};
if (D.muestra) { document.body.classList.add("m"); const b = document.createElement("div"); b.className = "mu"; b.textContent = "Versión de muestra, no es la tarjeta final"; document.body.prepend(b); }
</script>
</body>
</html>
